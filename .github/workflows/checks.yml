name: Verify source and build Android demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements-dev.txt
      - run: python scripts/check_corpus.py
      - run: python -m pytest services/api/tests -q
        env:
          PYTHONPATH: services/api
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python scripts/bootstrap_mobile.py
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze --no-fatal-infos
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: quran-janab-android-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
