name: quran_janab
description: An offline Quran reader and experimental full-duplex practice companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_webrtc: 1.6.2+hotfix.3
  shared_preferences: 2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/quran.json
    - assets/corpus-manifest.json
    - assets/fonts/OFL.txt
    - assets/licenses/TANZIL-NOTICE.txt
    - assets/licenses/CORPUS-LICENSE.txt
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
